[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codemate"
version = "0.1.0"
description = "A local tracker for Git codebases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["certifi>=2024.12.14"]

[project.optional-dependencies]
embeddings = ["fastembed>=0.7"]

[project.scripts]
codemate = "codemate.cli:main"

[tool.setuptools.packages.find]
include = ["codemate*"]
